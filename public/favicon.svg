<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D1B8" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#A88858" />
    </linearGradient>
    <radialGradient id="obsidianBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141B24" />
      <stop offset="100%" stop-color="#0C1017" />
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Circular Base -->
  <circle cx="32" cy="32" r="30" fill="url(#obsidianBg)" stroke="url(#brassGrad)" stroke-width="1.2" />

  <!-- Subtle Girih 8-Pointed Star Lattice Ring -->
  <g stroke="url(#brassGrad)" stroke-width="0.6" fill="none" opacity="0.6">
    <rect x="13" y="13" width="38" height="38" rx="2" />
    <rect x="13" y="13" width="38" height="38" rx="2" transform="rotate(45 32 32)" />
  </g>

  <!-- Inner Fine Ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#brassGrad)" stroke-width="0.5" stroke-dasharray="1.5, 1.5" opacity="0.7" />

  <!-- Intertwined Typographic Monogram 'A & S' -->
  <text x="32" y="38" 
        font-family="'Cinzel Decorative', 'Cormorant Garamond', serif" 
        font-size="20" 
        font-weight="500" 
        fill="url(#brassGrad)" 
        text-anchor="middle" 
        letter-spacing="0.05em">A&amp;S</text>

  <!-- Tiny Accents -->
  <circle cx="32" cy="18" r="1.2" fill="url(#brassGrad)" />
  <circle cx="32" cy="46" r="1.2" fill="url(#brassGrad)" />
</svg>